<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PyBot — College Chatbot</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background:#f4f6fc; margin:0; display:flex; justify-content:center; }
  .app { width:100%; max-width:720px; height:100vh; display:flex; flex-direction:column; background:#fff; box-shadow:0 0 20px rgba(0,0,0,.08); }
  header { background:#1E2761; color:#fff; padding:16px 20px; font-size:20px; font-weight:bold; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:10px 14px; border-radius:12px; max-width:80%; white-space:pre-wrap; line-height:1.4; }
  .user { align-self:flex-end; background:#1E2761; color:#fff; }
  .bot { align-self:flex-start; background:#eef1fb; color:#1E2761; }
  .meta { font-size:11px; color:#8892c4; margin-top:4px; }
  form { display:flex; border-top:1px solid #eee; }
  input { flex:1; border:none; padding:16px; font-size:15px; outline:none; }
  button { background:#1E2761; color:#fff; border:none; padding:0 24px; cursor:pointer; font-weight:bold; }
  button:hover { background:#161d4d; }
</style>
</head>
<body>
<div class="app">
  <header>🤖 PyBot — College Subjects & AI Tutor</header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Ask about exams, deadlines, Python, ML..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
let history = [];

function addMessage(text, cls, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  history.push({ role: 'user', content: text });
  input.value = '';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    addMessage(data.reply, 'bot', data.source ? `source: ${data.source}${data.intent ? ' | intent: ' + data.intent : ''}` : null);
    history.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    addMessage('Error contacting the server.', 'bot');
  }
});
</script>
</body>
</html>
